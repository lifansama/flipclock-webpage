<html>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="stylesheet" href="./css/flipclock.css">
		<link rel="stylesheet" href="./css/style.css">
		
		<style>
			#box {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 100vh;
			}

			#content {
				display: flex;
				flex-direction: column;
				align-items: center;
			}
		</style>

		<!-- <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script> -->

		<script src="./js/jquery.min.js"></script>		
		<script src="./js/flipclock.js"></script>		
	</head>
	<body>

		<div id="box">
			<div id="content">
				<div class="clock" id="flipclock" ondblclick="toggleFullScreen()"></div>
				<h1 class="date" id='ShowDate'></h1>
			</div>
		</div>

		<script type="text/javascript">
			// mobile
			if(/Android|webOS|iPhone|iPod|BlackBerry/i.test(navigator.userAgent)) {
				document.getElementById('flipclock').setAttribute("style","zoom:1.5;");
    			document.getElementById('ShowDate').setAttribute("style","zoom:1.5;");
    		}


			function title_time() {
				var clock;
				$(document).ready(function() {
					clock = $('.clock').FlipClock({
						clockFace: 'TwentyFourHourClock',
						showSeconds: false
					});
				});
				var month = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
				var week = ['Mon', 'Tues', 'wed', 'Thur', 'Fri', 'Sat', 'Sun'];
				var d = new Date();
				var hours = d.getHours().toString().padStart(2, '0');
				var minutes = d.getMinutes().toString().padStart(2, '0');
				var seconds = d.getSeconds().toString().padStart(2, '0');
				var timeString = hours + ':' + minutes + ' ' + (d.getMonth() + 1) + "-" + d.getDate() + " 周" +'日一二三四五六'.charAt(new Date().getDay());;
				document.title = timeString;
				document.getElementById('ShowDate').innerHTML = d.getFullYear() + "年" +(d.getMonth() + 1) + "月" + d.getDate() + "日" + ' 星期'+'日一二三四五六'.charAt(new Date().getDay());
			}
			title_time();
			setInterval(title_time,1000);
			function toggleFullScreen() {
				var elem = document.documentElement;
				if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
					if (elem.requestFullscreen) {
						elem.requestFullscreen();
					} else if (elem.msRequestFullscreen) {
						elem.msRequestFullscreen();
					} else if (elem.mozRequestFullScreen) {
						elem.mozRequestFullScreen();
					} else if (elem.webkitRequestFullscreen) {
						elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
					}
				} else {
					if (document.exitFullscreen) {
						document.exitFullscreen();
					} else if (document.msExitFullscreen) {
						document.msExitFullscreen();
					} else if (document.mozCancelFullScreen) {
						document.mozCancelFullScreen();
					} else if (document.webkitExitFullscreen) {
						document.webkitExitFullscreen();
					}
				}
			}
		</script>

	</body>
</html>
